# Project-wide Gradle settings.
# Specifies the JVM arguments used for the daemon process.
# High heap (4GB) + ParallelGC + Metaspace prevents GC pauses during dexing & compilation.
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g

# Run sub-project builds in parallel (Capacitor plugins compile concurrently)
org.gradle.parallel=true

# Enable the Gradle Build Cache (caches task outputs across builds)
org.gradle.caching=true

# Configure only projects required for the current task
org.gradle.configureondemand=true

# File system watching for faster incremental build checks on Windows
org.gradle.vfs.watch=true

# AndroidX package structure
android.useAndroidX=true

