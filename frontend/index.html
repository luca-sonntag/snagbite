<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      const theme = localStorage.getItem('theme') || 'light';
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.style.setProperty('--app-bg', '#09090b');
        document.documentElement.style.setProperty('--app-text', '#ffffff');
        document.documentElement.style.setProperty('--app-subtext', '#a1a1aa');
        document.documentElement.style.setProperty('--app-card-bg', '#121215');
      } else {
        document.documentElement.classList.remove('dark');
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.style.setProperty('--app-bg', '#f8fafc');
        document.documentElement.style.setProperty('--app-text', '#111827');
        document.documentElement.style.setProperty('--app-subtext', '#6b7280');
        document.documentElement.style.setProperty('--app-card-bg', '#ffffff');
      }
    })();
  </script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      background-color: var(--app-bg, #f8fafc);
      margin: 0;
      padding: 0;
    }
    @keyframes inline-breathe {
      0%, 100% { transform: scale(0.98); }
      50% { transform: scale(1.02); }
    }
    @keyframes inline-glow {
      0%, 100% { transform: scale(0.92); opacity: 0.15; }
      50% { transform: scale(1.18); opacity: 0.32; }
    }
    @keyframes inline-bounce {
      0%, 100% { transform: translateY(0); opacity: 0.4; }
      50% { transform: translateY(-4px); opacity: 1; }
    }
  </style>
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="Verwandle Instagram Reels in interaktive Kochrezepte" />
  <title>Snagbite - Dein Reel-Rezeptbuch</title>
</head>

<body>
  <div id="root">
    <div style="position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background-color:var(--app-bg,#f9fafb);user-select:none;font-family:'Outfit',system-ui,sans-serif;">
      <div style="position:absolute;width:288px;height:288px;background:rgba(16,185,129,0.15);filter:blur(48px);border-radius:9999px;pointer-events:none;animation:inline-glow 2.4s ease-in-out infinite;"></div>
      <div style="position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;">
        <div style="box-sizing:border-box;width:88px;height:88px;border-radius:24px;background-color:var(--app-card-bg,#ffffff);padding:16px;box-shadow:0 12px 36px rgba(16,185,129,0.22);display:flex;align-items:center;justify-content:center;animation:inline-breathe 2.4s ease-in-out infinite;">
          <img src="/logo-login.png" alt="Snagbite" style="width:100%;height:100%;object-fit:contain;" />
        </div>
        <div style="margin-top:20px;font-size:24px;font-weight:900;letter-spacing:-0.03em;color:var(--app-text,#111827);">
          Snagbite
        </div>
        <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;">
          <span style="width:8px;height:8px;border-radius:9999px;background-color:#10b981;animation:inline-bounce 1.2s ease-in-out infinite;animation-delay:0ms;"></span>
          <span style="width:8px;height:8px;border-radius:9999px;background-color:#10b981;animation:inline-bounce 1.2s ease-in-out infinite;animation-delay:180ms;"></span>
          <span style="width:8px;height:8px;border-radius:9999px;background-color:#10b981;animation:inline-bounce 1.2s ease-in-out infinite;animation-delay:360ms;"></span>
        </div>
        <div style="height:24px;margin-top:12px;display:flex;align-items:center;justify-content:center;">
          <p id="preloader-text" style="margin:0;font-size:12px;font-weight:600;color:var(--app-subtext,#6b7280);text-align:center;padding:0 16px;">
            Dein Kochbuch wird angerichtet…
          </p>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      try {
        const lang = localStorage.getItem('kb_language') || (navigator.language && navigator.language.startsWith('de') ? 'de' : 'en');
        const el = document.getElementById('preloader-text');
        if (el && lang === 'en') {
          el.textContent = 'Setting your table…';
        }
      } catch (e) {}
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
